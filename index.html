<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Counter</title>

  <style>

    .title {
  position: absolute;
  top: 45px;
  left: 0;
  width: 100%;
  text-align: center;

  font-size: 26px;
  font-weight: 500;
  letter-spacing: 1px;
  color: #1d1d1f;
}
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f5f5f7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .wrapper {
      display: flex;
      flex-direction: column;
      gap: 70px;
    }

    .counter-box {
      text-align: center;
    }

    .name {
      font-size: 22px;
      font-weight: 600;
      color: #666;
      margin-bottom: 18px;
    }

    .counter {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 35px;
    }

    .number {
      min-width: 120px;
      text-align: center;
      font-size: 90px;
      font-weight: 700;
      color: #1d1d1f;
      line-height: 1;
    }

    button {
      width: 70px;
      height: 70px;
      border: none;
      border-radius: 22px;
      background: white;
      color: #1d1d1f;
      font-size: 38px;
      cursor: pointer;

      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);

      transition:
        transform 0.15s ease,
        box-shadow 0.15s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 7px 20px rgba(0, 0, 0, 0.12);
    }

    button:active {
      transform: scale(0.92);
    }

    .readonly-space {
      width: 70px;
      height: 70px;
    }

    @media (max-width: 500px) {

      .wrapper {
        gap: 55px;
      }

      .counter {
        gap: 22px;
      }

      .number {
        min-width: 90px;
        font-size: 70px;
      }

      button,
      .readonly-space {
        width: 60px;
        height: 60px;
      }

      button {
        border-radius: 18px;
        font-size: 32px;
      }
    }
  </style>
</head>

<body>

<div class="title">Verzweiflungen</div>

<div class="wrapper">


  <!-- COUNTER 1 -->

  <div class="counter-box">

    <div class="name">
      Jonas
    </div>

    <div class="counter">

      <div class="readonly-space"></div>

      <div
        class="number"
        id="number1"
      >
        0
      </div>

      <div class="readonly-space"></div>

    </div>

  </div>


  <!-- COUNTER 2 -->

  <div class="counter-box">

    <div class="name">
      Tarja
    </div>

    <div class="counter">

      <button id="minus2">
        −
      </button>

      <div
        class="number"
        id="number2"
      >
        0
      </div>

      <button id="plus2">
        +
      </button>

    </div>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

  const SUPABASE_URL =
    "https://ontttmhnzkyxdhjdupna.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_u1m_2Y4FaI-xPRoAR6Nr-A_dIXfjA6J";


  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  const number1 =
    document.getElementById("number1");

  const number2 =
    document.getElementById("number2");

  const plus2 =
    document.getElementById("plus2");

  const minus2 =
    document.getElementById("minus2");


  let counter1 = 0;
  let counter2 = 0;


  // ================================
  // BEIDE LADEN
  // ================================

  async function loadCounters() {

    const { data, error } =
      await supabaseClient
        .from("counter")
        .select("id,value")
        .order("id");


    if (error) {

      console.error(
        "Fehler beim Laden:",
        error
      );

      return;

    }


    const c1 =
      data.find(row => row.id === 1);

    const c2 =
      data.find(row => row.id === 2);


    if (c1) {

      counter1 =
        c1.value;

      number1.textContent =
        counter1;

    }


    if (c2) {

      counter2 =
        c2.value;

      number2.textContent =
        counter2;

    }

  }


  // ================================
  // COUNTER 2 SPEICHERN
  // ================================

  async function saveCounter2() {

    const { error } =
      await supabaseClient
        .from("counter")
        .update({
          value: counter2
        })
        .eq("id", 2);


    if (error) {

      console.error(
        "Fehler beim Speichern:",
        error
      );

    }

  }


  plus2.addEventListener(
    "click",

    async () => {

      counter2++;

      number2.textContent =
        counter2;

      await saveCounter2();

    }
  );


  minus2.addEventListener(
    "click",

    async () => {

      if (counter2 > 0) {

        counter2--;

        number2.textContent =
          counter2;

        await saveCounter2();

      }

    }
  );


  loadCounters();


  // Beide Seiten synchron halten

  setInterval(
    loadCounters,
    2000
  );

</script>

</body>
</html>
